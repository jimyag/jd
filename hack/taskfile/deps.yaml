version: "3"

output: "prefixed"

vars:
  TOOLS:
    - github.com/go-task/task/v3/cmd/task@latest
    - github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

tasks:
  deps:
    desc: 下载并安装依赖工具
    cmds:
      - go mod download
      - for: { var: TOOLS, as: TOOL }
        cmd: go install {{.TOOL}}
        parallel: true
